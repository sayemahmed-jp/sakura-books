<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>ভর্তি চলছে</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Shippori+Mincho:wght@600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#a13f60}a:hover{color:#7d2f4a}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: {{accent}}; font-family: 'Hind Siliguri', sans-serif; color: #ffffff; display: flex; flex-direction: column; padding: 84px 80px 72px; gap: 0">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 26px; font-weight: 700; letter-spacing: 0.12em">さくら日本語学院</div>
<div style="font-family: 'Shippori Mincho', serif; font-size: 30px; font-weight: 800">入学受付中</div>
</div>
<h1 style="margin: 70px 0 0; font-size: 132px; line-height: 1.1; font-weight: 700">ভর্তি চলছে</h1>
<div style="margin-top: 22px; display: inline-flex; align-self: flex-start; background: #ffffff; color: #a13f60; border-radius: 999px; padding: 12px 30px; font-size: 38px; font-weight: 700">প্রথম ৩টি ক্লাস সম্পূর্ণ ফ্রি</div>
<div style="margin-top: 56px; background: #ffffff; color: #1b2745; border-radius: 28px; padding: 18px 40px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 2px solid #f3dde5; font-size: 36px"><span style="font-weight: 600">N5 কোর্স <span style="color: #5b6478; font-size: 26px">৩ মাস</span></span><b>২০,০০০ ৳</b></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 2px solid #f3dde5; font-size: 36px"><span style="font-weight: 600">N4 কোর্স <span style="color: #5b6478; font-size: 26px">৩ মাস</span></span><b>২০,০০০ ৳</b></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 2px solid #f3dde5; font-size: 36px"><span style="font-weight: 600">N5 + N4 প্যাকেজ <span style="color: #5b6478; font-size: 26px">৬ মাস</span></span><b style="color: #a13f60">৩৫,০০০ ৳</b></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; font-size: 36px"><span style="font-weight: 600">N5 + N4 + N3 <span style="color: #5b6478; font-size: 26px">১০ মাস</span></span><b>৪৫,০০০ ৳</b></div>
</div>
<div style="margin-top: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 30px; font-weight: 600; text-align: center">
<div style="border: 2.5px solid rgba(255,255,255,0.7); border-radius: 18px; padding: 16px 8px">সকাল ব্যাচ</div>
<div style="border: 2.5px solid rgba(255,255,255,0.7); border-radius: 18px; padding: 16px 8px">সন্ধ্যা ব্যাচ</div>
<div style="border: 2.5px solid rgba(255,255,255,0.7); border-radius: 18px; padding: 16px 8px">অনলাইন</div>
</div>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; font-size: 28px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">অনলাইনে আবেদন: লিংক কমেন্টে</span><span>WhatsApp: +81 70-9222-2401</span></div>
<span style="opacity: 0.9">প্রতি ব্যাচে সর্বোচ্চ ২০ জন</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#a13f60","options":["#a13f60","#2c3e8f","#1f6f66"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#a13f60' };
  }
}
</script>
</body>
</html>
