<title>さくら日本語学院 JLPT模試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
/* Layout: one calm reading column like an exam booklet; mark-sheet bubbles carry the identity */
:root{
  --paper:#f4f6fb; --surface:#ffffff; --ink:#151c38; --muted:#5a6382; --line:#dde2ee;
  --ai:#27399a; --ai-soft:#e5e9f9; --ok:#1d8656; --ok-soft:#e2f4ea; --ng:#c43d2c; --ng-soft:#fbe9e6;
  --pencil:#353a4c; --warn:#a76a00;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Hind Siliguri","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic","Hind Siliguri",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.jp{font-family:var(--f-jp)}
h1,h2,h3{text-wrap:balance;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface)}
.link{background:none;border:0;color:var(--ai);font-weight:600;font-size:14px;padding:4px 2px}

.hero{padding-block:36px 20px;display:grid;gap:10px}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ai);font-weight:600}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);line-height:1.15;font-weight:800}
.hero p{color:var(--muted);max-width:60ch;margin:0}
.field{display:grid;gap:6px;margin-block:18px 8px}
.field label{font-size:14px;font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;max-width:420px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.lv-h{display:flex;align-items:center;gap:14px}
.seal{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--ai);color:var(--ai);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.lv-h h2{font-size:18px}
.lv-h small{color:var(--muted);font-size:13px;display:block}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--ai);color:var(--surface)}
.btn.ghost{background:var(--ai-soft);color:var(--ai)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec-title{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-block:36px 10px}
.sec-lead{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:60ch}

/* monthly course track */
.track-list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.course{padding:10px 18px;font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--ai);background:var(--ai-soft)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.course + .mrow{border-top:0}
.mnum{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.mnum.done{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.mtxt{min-width:0}
.mtxt b{display:block;font-size:15px}
.mtxt span{font-size:13px;color:var(--muted)}

.hist{display:grid;gap:8px}
.hrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;flex-wrap:wrap}
.hrow .score{font-variant-numeric:tabular-nums;font-weight:700}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.foot a{color:var(--ai);word-break:break-all}

.ebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px 6px}
.etitle{font-size:14px;font-weight:600;min-width:0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:4px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--ng);border-color:var(--ng)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.tab[aria-current="true"]{border-color:var(--ai);color:var(--ai);font-weight:600}
.tab .jp{font-size:12px;margin-left:4px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-block:4px 16px}
.prog i{display:block;height:100%;background:var(--ai);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:18px}
.flag{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;font-size:13px}
.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.passage{background:var(--paper);border-radius:10px;padding:14px 16px;font-family:var(--f-jp);font-size:16px;line-height:2;white-space:pre-line;border-left:3px solid var(--line)}
.prompt{font-family:var(--f-jp);font-size:19px;line-height:1.9}
.prompt u{text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--ai)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-jp);font-size:17px;width:100%}
button.opt:hover{border-color:var(--ai)}
.bub{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--muted);transition:background .15s}
.opt[aria-checked="true"]{border-color:var(--pencil)}
.opt[aria-checked="true"] .bub{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:8px}
.play svg{width:16px;height:16px;fill:currentColor}
.script{font-family:var(--f-jp);font-size:15px;background:var(--paper);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.sheet{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sheet h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px}
.cell{position:relative;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.done{background:var(--pencil);border-color:var(--pencil);color:var(--surface)}
.cell.cur{outline:2px solid var(--ai);outline-offset:2px}
.cell.fl::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.45);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--surface);border-radius:16px;padding:22px;max-width:400px;width:100%;display:grid;gap:14px}
.mbox .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.res-h{padding-block:28px 10px;display:grid;gap:8px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:64px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:18px}
.stamp{display:inline-grid;place-items:center;border:3px solid currentColor;border-radius:8px;padding:2px 14px;font-family:var(--f-display);font-weight:800;font-size:22px;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)} .stamp.ng{color:var(--ng)}
.bars{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.bar-row{display:grid;gap:6px}
.bar-l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar-l b{font-variant-numeric:tabular-nums}
.trk{height:10px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.trk i{position:absolute;inset:0 auto 0 0;background:var(--ai);border-radius:6px}
.trk.ok i{background:var(--ok)} .trk.ng i{background:var(--ng)}
.minline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.codebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.codebox code{font-size:12px;word-break:break-all;flex:1;min-width:0;user-select:all}
.rev{display:grid;gap:14px}
.exp{border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.exp b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:680px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em}
td.n{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mini{display:inline-flex;gap:3px;vertical-align:middle}
.mini i{width:22px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;display:inline-block}
.mini i span{position:absolute;inset:0 auto 0 0;background:var(--ai)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media (max-width:420px){.mrow{grid-template-columns:auto 1fr}.mrow .btn{grid-column:1 / -1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <button class="brand" id="goHome" type="button"><b>さくら日本語学院</b><span>JLPT 模試</span></button>
  <div class="sp"></div>
  <button class="link" id="goTeacher" type="button"></button>
  <div class="seg" role="group" aria-label="Language" id="langSeg">
    <button type="button" data-l="bn">বাংলা</button><button type="button" data-l="ja">日本語</button><button type="button" data-l="en">EN</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
/* ---------- UI strings ---------- */
const T={

{id:"n5m9",s:"moji",p:"<u>右</u>に まがって ください。",c:["みぎ","ひだり","うえ","した"],e:{bn:"右 = みぎ (ডান)। 左 = ひだり (বাম)।",ja:"「右」は「みぎ」、「左」は「ひだり」です。",en:"右 = みぎ (right). 左 = ひだり (left)."}},
{id:"n5m10",s:"moji",p:"としょかんで ほんを（　）。",c:["かりました","おしえました","すわりました","のぼりました"],e:{bn:"লাইব্রেরি থেকে বই নেওয়া = かります (ধার নেওয়া)। かします হলো ধার দেওয়া।",ja:"図書館で本を「かります」（借ります）。",en:"At a library you borrow books: かります. (かします would be to lend.)"}},
{id:"n5g1",s:"bunpo",p:"わたし（　）がくせいです。",c:["は","を","に","で"],e:{bn:"「A は B です」= A হলো B। বিষয় বোঝাতে は ব্যবহার হয়।",ja:"「AはBです」の形です。",en:"The pattern 'A は B です' (A is B) marks the topic with は."}},
{id:"n5g2",s:"bunpo",p:"えきの まえ（　）ともだちを まちます。",c:["で","に","を","へ"],e:{bn:"কাজটা কোথায় হচ্ছে বোঝাতে で। অপেক্ষা করার জায়গা = えきの まえで।",ja:"動作をする場所には「で」を使います。",en:"で marks the place where an action happens."}},
{id:"n5g3",s:"bunpo",p:"「この りんごは（　）ですか。」「150えんです。」",c:["いくら","いくつ","どこ","だれ"],e:{bn:"দাম জিজ্ঞেস করতে いくら। いくつ = কয়টি/বয়স কত।",ja:"値段を聞くときは「いくら」です。",en:"いくら asks the price. いくつ asks how many / how old."}},
{id:"n5g4",s:"bunpo",p:"きのうは あめ（　）。",c:["でした","です","じゃないです","ますでした"],e:{bn:"きのう (গতকাল) অতীত, তাই です-র অতীত রূপ でした।",ja:"「きのう」は過去なので「でした」です。",en:"きのう is past, so use でした, the past form of です."}},
{id:"n5g5",s:"bunpo",p:"「いっしょに えいがを（　）。」「いいですね。」",c:["みませんか","みました","みています","みない"],e:{bn:"〜ませんか দিয়ে আমন্ত্রণ জানানো হয়: “একসাথে সিনেমা দেখবে?”",ja:"「〜ませんか」は誘うときの表現です。",en:"〜ませんか makes an invitation: 'Won't you watch a film with me?'"}},
{id:"n5g6",s:"bunpo",p:"この かばんは（　）、かるいです。",c:["おおきくて","おおきいで","おおきいくて","おおきで"],e:{bn:"い-বিশেষণ জোড়া দিতে い বাদ দিয়ে くて: おおきい → おおきくて।",ja:"い形容詞は「い」を取って「くて」をつけます。",en:"To join an い-adjective, drop い and add くて: おおきくて."}},
{id:"n5g7",s:"bunpo",p:"まどを（　）ください。",c:["あけて","あけ","あける","あけた"],e:{bn:"অনুরোধ: て-রূপ + ください। あける → あけて ください।",ja:"お願いは「て形＋ください」です。",en:"Requests use the て-form + ください: あけて ください."}},
{id:"n5g8",s:"bunpo",p:"つくえの うえに ねこが（　）。",c:["います","あります","いきます","です"],e:{bn:"জীবিত প্রাণী থাকলে います, জড় বস্তু হলে あります।",ja:"人や動物は「います」、物は「あります」です。",en:"Living things use います; objects use あります."}},
{id:"n5r1a",s:"dokkai",g:"n5r1",p:"ミンさんは なにを しますか。",c:["のみものを かいます","たべものを つくります","6じに ゆきさんを まちます","へやを そうじします"],e:{bn:"চিঠিতে পানীয় কিনে আনতে বলা হয়েছে (のみものを かって きて ください)। খাবার ゆき নিজে বানাবে।",ja:"「のみものを かって きて ください」と書いてあります。",en:"The note asks Min to buy drinks; Yuki will make the food."}},
{id:"n5r1b",s:"dokkai",g:"n5r1",p:"パーティーは どこで しますか。",c:["ゆきさんの うち","ミンさんの うち","レストラン","がっこう"],e:{bn:"「わたしの うちで します」— এখানে わたし হলো চিঠির লেখক ゆき।",ja:"「わたし」はメモを書いたゆきさんです。",en:"'わたしの うち' — 'I' is Yuki, who wrote the note."}},
{id:"n5r2a",s:"dokkai",g:"n5r2",p:"きょう なんで かいしゃへ いきましたか。",c:["じてんしゃ","でんしゃ","バス","あるいて"],e:{bn:"প্রতিদিন ট্রেনে যায়, কিন্তু আজ じてんしゃで いきました (সাইকেলে গেছে)।",ja:"いつもは電車ですが、きょうは自転車です。",en:"Usually by train, but today by bicycle."}},
{id:"n5r2b",s:"dokkai",g:"n5r2",p:"どうして じてんしゃで いきましたか。",c:["あめが ふって いなかったから","でんしゃが こんで いたから","かいしゃが ちかいから","あさ はやく おきたから"],e:{bn:"「あめが ふって いませんでしたから」— বৃষ্টি হচ্ছিল না, তাই। から = কারণ।",ja:"「〜から」は理由を表します。",en:"から gives the reason: it wasn't raining."}},
{id:"n5l1",s:"chokai",p:"おとこの ひとは なにを のみますか。",sc:[["N","おんなの ひとと おとこの ひとが はなして います。おとこの ひとは なにを のみますか。"],["F","なにを のみますか。コーヒーですか。"],["M","コーヒーは ちょっと……。こうちゃを おねがいします。"],["F","さとうは？"],["M","いりません。"]],c:["さとうを いれない こうちゃ","さとうを いれた こうちゃ","コーヒー","みず"],e:{bn:"コーヒーは ちょっと = ভদ্রভাবে না বলা। চা চাইলেন, চিনি いりません (লাগবে না)।",ja:"「ちょっと…」は断りです。砂糖は「いりません」。",en:"'コーヒーは ちょっと…' is a polite no. He wants tea, no sugar."}},
{id:"n5l2",s:"chokai",p:"つぎの バスは なんじですか。",sc:[["N","おとこの ひとと おんなの ひとが はなして います。つぎの バスは なんじですか。"],["M","すみません、つぎの バスは なんじですか。"],["F","9じ15ふんです。"],["M","9じ50ぷんですか。"],["F","いいえ、15ふんです。"]],c:["9じ15ふん","9じ50ぷん","9じ5ふん","10じ15ふん"],e:{bn:"じゅうごふん (15) আর ごじゅっぷん (50) শুনতে কাছাকাছি। মহিলা আবার বলেছেন 15।",ja:"「じゅうごふん」と「ごじゅっぷん」に注意しましょう。",en:"じゅうごふん (15) and ごじゅっぷん (50) sound alike; she repeats 15."}},
{id:"n5l3",s:"chokai",p:"ともだちの うちに はいります。なんと いいますか。",sc:[["N","ともだちの うちに はいります。なんと いいますか。"]],c:["おじゃまします","いってきます","いただきます","おやすみなさい"],e:{bn:"কারো বাসায় ঢোকার সময় おじゃまします। いってきます = নিজের বাসা থেকে বের হওয়ার সময়।",ja:"人の家に入るときは「おじゃまします」です。",en:"Entering someone's home: おじゃまします. いってきます is for leaving your own home."}},
{id:"n5l4",s:"chokai",p:"へんじは どれですか。",sc:[["N","へんじを えらんで ください。"],["F","おげんきですか。"]],c:["はい、げんきです","いいえ、どういたしまして","はい、いただきます","はい、げんきでした"],e:{bn:"“কেমন আছেন?” প্রশ্নটা বর্তমান কালে, তাই উত্তরও বর্তমানে: はい、げんきです।",ja:"今のことなので「げんきです」と答えます。",en:"The question is about now, so answer in the present: げんきです."}}
],
n4full:[
{id:"n4m1",s:"moji",p:"毎朝 <u>運動</u>を して います。",c:["うんどう","うんど","うんとう","うどう"],e:{bn:"運動 = うんどう (ব্যায়াম)।",ja:"「運動」は「うんどう」と読みます。",en:"運動 is うんどう (exercise), with a voiced どう."}},
{id:"n4m2",s:"moji",p:"<u>急に</u> 雨が ふって きました。",c:["きゅうに","いそぎに","ぎゅうに","きょうに"],e:{bn:"急に = きゅうに (হঠাৎ)। 急ぐ (いそぐ) ক্রিয়ায় একই কাঞ্জি থাকলেও পড়া আলাদা।",ja:"「急に」は「きゅうに」。「急ぐ」は「いそぐ」です。",en:"急に = きゅうに (suddenly). The verb 急ぐ is read いそぐ."}},
{id:"n4m3",s:"moji",p:"今日は <u>特別</u>な 日です。",c:["とくべつ","とくべち","どくべつ","とくへつ"],e:{bn:"特別 = とくべつ (বিশেষ)।",ja:"「特別」は「とくべつ」です。",en:"特別 = とくべつ (special)."}},
{id:"n4m4",s:"moji",p:"国の 母に にもつを <u>おくります</u>。",c:["送ります","返ります","迷ります","遅ります"],e:{bn:"おくる (পাঠানো) = 送る। 遅れる (おくれる) মানে দেরি হওয়া।",ja:"「送る」＝おくる。「遅れる」は「おくれる」で意味が違います。",en:"おくる (send) is 送る. 遅れる (おくれる) means 'be late'."}},
{id:"n4m5",s:"moji",p:"<u>しゅくだい</u>を わすれました。",c:["宿題","宿顔","宿頭","縮題"],e:{bn:"しゅくだい = 宿題 (বাড়ির কাজ)। 題, 顔, 頭 দেখতে কাছাকাছি।",ja:"「しゅくだい」は「宿題」です。",en:"しゅくだい is 宿題 (homework). 題, 顔 and 頭 look alike."}},
{id:"n4m6",s:"moji",p:"この 道は 車が 多くて（　）です。",c:["あぶない","ねむい","さびしい","やわらかい"],e:{bn:"গাড়ি বেশি, তাই রাস্তা あぶない (বিপজ্জনক)।",ja:"車が多い道は「あぶない」です。",en:"A road with lots of cars is あぶない (dangerous)."}},
{id:"n4m7",s:"moji",p:"部屋が くらいので、電気を（　）ください。",c:["つけて","けして","しめて","あけて"],e:{bn:"বাতি জ্বালানো = 電気を つける। けす = নিভানো।",ja:"電気は「つける」「けす」を使います。",en:"Lights: つける (turn on) / けす (turn off). It's dark, so つけて."}},
{id:"n4m8",s:"moji",p:"「父は いま <u>るす</u>です。」と だいたい 同じ いみは どれですか。",c:["父は いま 家に いません","父は いま ねて います","父は いま いそがしいです","父は いま びょうきです"],e:{bn:"るす = বাড়িতে নেই (বাইরে গেছে)।",ja:"「るす」は「家にいない」という意味です。",en:"るす means not at home."}},
{id:"n4m9",s:"moji",p:"夏休みの <u>計画</u>を 立てます。",c:["けいかく","けいが","けかく","けいかつ"],e:{bn:"計画 = けいかく (পরিকল্পনা)।",ja:"「計画」は「けいかく」です。",en:"計画 = けいかく (plan)."}},
{id:"n4m10",s:"moji",p:"もう 12時ですから、そろそろ（　）。",c:["しつれいします","いらっしゃいます","ごぞんじです","はじめまして"],e:{bn:"বিদায় নেওয়ার ভদ্র বাক্য: そろそろ しつれいします।",ja:"帰るときの丁寧な表現は「そろそろしつれいします」です。",en:"'そろそろ しつれいします' is the polite way to say you'll be leaving."}},
{id:"n4g1",s:"bunpo",p:"日本へ（　）、すしを 食べて みたいです。",c:["行ったら","行っても","行きながら","行くのに"],e:{bn:"〜たら = “যদি/যখন … হয়”। জাপানে গেলে সুশি খেয়ে দেখতে চাই।",ja:"「〜たら」は条件を表します。",en:"〜たら = 'when/if': when I go to Japan, I want to try sushi."}},
{id:"n4g2",s:"bunpo",p:"わたしは 先生に ほめ（　）。",c:["られました","させました","させられました","ました"],e:{bn:"কর্মবাচ্য (受身): 先生に ほめられました = শিক্ষক আমার প্রশংসা করলেন।",ja:"受身形「ほめられる」です。",en:"Passive: 先生に ほめられました = I was praised by the teacher."}},
{id:"n4g3",s:"bunpo",p:"友だちが わたしに ペンを かして（　）。",c:["くれました","あげました","もらいました","やりました"],e:{bn:"অন্য কেউ আমার জন্য কিছু করলে 〜て くれる।",ja:"人が私のために何かをするときは「〜てくれる」です。",en:"When someone does something for me: 〜て くれる."}},
{id:"n4g4",s:"bunpo",p:"この かんじは むずかしくて（　）。",c:["読めません","読まれます","読ませます","読みたがります"],e:{bn:"সম্ভাব্য রূপ (可能形): 読める = পড়তে পারা। কঠিন, তাই 読めません।",ja:"可能形「読める」の否定です。",en:"Potential form: 読める (can read) → 読めません."}},
{id:"n4g5",s:"bunpo",p:"天気よほうに よると、あしたは 雨が（　）そうです。",c:["ふる","ふり","ふって","ふれ"],e:{bn:"〜に よると দিয়ে শোনা কথা বোঝায়; তখন সাধারণ রূপ + そうです: ふる そうです।",ja:"伝聞の「そうです」は普通形につきます。",en:"Hearsay そうです follows the plain form: ふるそうです."}},
{id:"n4g6",s:"bunpo",p:"ねる（　）、はを みがきます。",c:["まえに","あとで","ながら","までに"],e:{bn:"অভিধান রূপ + まえに = … করার আগে। あとで-এর আগে た-রূপ লাগে।",ja:"「辞書形＋まえに」です。「あとで」は「た形」につきます。",en:"Dictionary form + まえに = before. あとで needs the た-form."}},
{id:"n4g7",s:"bunpo",p:"母は 子どもに やさいを（　）。",c:["食べさせます","食べられます","食べさせられます","食べたがります"],e:{bn:"প্রযোজক রূপ (使役): 食べさせる = খাওয়ানো।",ja:"使役形「食べさせる」です。",en:"Causative: 食べさせる = make/let someone eat."}},
{id:"n4g8",s:"bunpo",p:"この ケーキは おいし（　）ですね。",c:["そう","そうな","そうに","らしく"],e:{bn:"দেখে মনে হওয়া: い বাদ দিয়ে そう — おいしそうです।",ja:"見た様子は「おいしそうです」です。",en:"Looks like: drop い + そう: おいしそうです."}},
{id:"n4r1a",s:"dokkai",g:"n4r1",p:"土曜日に 図書館は 何時に しまりますか。",c:["5時","8時","9時","10時"],e:{bn:"শনি ও রবিবার সকাল 10টা থেকে বিকেল 5টা পর্যন্ত খোলা।",ja:"土曜日と日曜日は夕方5時までです。",en:"Weekends: 10 a.m. to 5 p.m."}},
{id:"n4r1b",s:"dokkai",g:"n4r1",p:"お知らせの 内容と 合って いる ものは どれですか。",c:["一人 5さつまで かりられる","本は 1週間 かりられる","日曜日は 休みだ","月曜日は 10時から あく"],e:{bn:"একজন 5টি বই, 2 সপ্তাহের জন্য। রবিবার খোলা, সোমবার 9টায় খোলে।",ja:"「一人5さつまで、2週間」と書いてあります。",en:"Up to 5 books per person for 2 weeks. Sunday is open; Monday opens at 9."}},
{id:"n4r2a",s:"dokkai",g:"n4r2",p:"「わたし」は どうして その 店を 知りましたか。",c:["おばあさんが 教えて くれたから","インターネットで 調べたから","友だちと 行った ことが あるから","京都に 住んで いるから"],e:{bn:"ট্রেনে পাশের বৃদ্ধা দোকানের কথা বলেছেন (店を 教えて くれました)।",ja:"となりのおばあさんが教えてくれました。",en:"The elderly woman on the train told the writer about it."}},
{id:"n4l1",s:"chokai",p:"女の人は 何まい コピーしますか。",sc:[["N","会社で 女の人と 男の人が 話して います。女の人は 何まい コピーしますか。"],["F","田中さん、会議の しりょう、何まい コピーしましょうか。"],["M","10人 来るから 10まい……あ、部長の 分も おねがいします。"],["F","じゃ、11まいですね。"]],c:["11まい","10まい","12まい","1まい"],e:{bn:"10 জনের জন্য 10টি + ম্যানেজারের (部長) 1টি = 11টি।",ja:"10人分と部長の分で11まいです。",en:"10 for the attendees plus 1 for the manager = 11."}},
{id:"n4l2",s:"chokai",p:"女の人は どうして パーティーに 行きませんでしたか。",sc:[["N","男の人と 女の人が 話して います。女の人は どうして パーティーに 行きませんでしたか。"],["M","きのうの パーティー、どうして 来なかったの？"],["F","行きたかったんだけど、母が かぜを ひいて、病院に つれて 行ったの。"]],c:["お母さんを 病院に つれて 行ったから","自分が かぜを ひいたから","行きたくなかったから","仕事が いそがしかったから"],e:{bn:"অসুস্থ হয়েছিলেন মা, নিজে নন। মাকে হাসপাতালে নিয়ে গেছেন।",ja:"かぜをひいたのはお母さんです。",en:"It was her mother who caught a cold; she took her to hospital."}},
{id:"n4l3",s:"chokai",p:"友だちの かさを かりたいです。何と 言いますか。",sc:[["N","友だちの かさを かりたいです。何と 言いますか。"]],c:["かさ、かして くれない？","かさ、かして あげようか。","かさ、かりて くれる？","かさ、かしても いい？"],e:{bn:"কাউকে ধার দিতে বলা: かして くれない？ かして あげようか = আমি ধার দেব?",ja:"相手に頼むときは「かしてくれない？」です。",en:"Asking a friend to lend: かして くれない？"}},
{id:"n4l4",s:"chokai",p:"へんじは どれですか。",sc:[["N","へんじを えらんで ください。"],["M","すみません、ここで しゃしんを とっても いいですか。"]],c:["すみません、ここは ちょっと……","はい、とって いました","いいえ、とりませんでした","どういたしまして"],e:{bn:"অনুমতি চাওয়ার (〜ても いいですか) ভদ্র না-সূচক উত্তর: すみません、ここは ちょっと……",ja:"許可を断るときは「すみません、ちょっと…」と言います。",en:"A polite refusal to '〜ても いいですか': すみません、ここは ちょっと……"}}
],
m1:[
{id:"m1m1",s:"moji",p:"<u>先生</u>は にほんじんです。",c:["せんせい","せんせ","せいせい","さきせい"],e:{bn:"先生 = せんせい (শিক্ষক)। শেষের い খেয়াল করো: せん・せい। (পাঠ 1)",ja:"「先生」は「せんせい」と読みます。（第1課）",en:"先生 is read せんせい (teacher)."}},
{id:"m1m2",s:"moji",p:"<u>水よう日</u>に としょかんへ いきます。",c:["すいようび","みずようび","すいようひ","すようび"],e:{bn:"বারের নামে 水 = すい: 水よう日 = すいようび (বুধবার)। একা থাকলে みず (পানি)। (পাঠ 5)",ja:"曜日の「水」は「すい」と読みます。（第5課）",en:"In day names 水 is すい: すいようび (Wednesday). Alone it is みず (water)."}},
{id:"m1m3",s:"moji",p:"<u>午後</u> 3じに きて ください。",c:["ごご","ごぜん","ごこ","こご"],e:{bn:"午後 = ごご (দুপুরের পর, PM)। 午前 = ごぜん (AM)। (পাঠ 4)",ja:"「午後」は「ごご」、「午前」は「ごぜん」です。（第4課）",en:"午後 = ごご (p.m.); 午前 = ごぜん (a.m.)."}},
{id:"m1m4",s:"moji",p:"ともだちと えいがを <u>みました</u>。",c:["見ました","貝ました","目ました","兄ました"],e:{bn:"みます = 見ます (দেখা)। 貝 (ঝিনুক) আর 目 (চোখ) দেখতে কাছাকাছি, কিন্তু ভুল। (পাঠ 6)",ja:"「みます」は「見ます」と書きます。（第6課）",en:"みます is written 見ます (see). 貝 and 目 only look similar."}},
{id:"m1m5",s:"moji",p:"まいあさ（　）を のみます。",c:["おちゃ","パン","ごはん","にく"],e:{bn:"のみます = পান করা, তাই পানীয় লাগবে: おちゃ (চা)। বাকিগুলো খাওয়ার জিনিস। (পাঠ 6)",ja:"「のみます」なので飲み物の「おちゃ」です。（第6課）",en:"のみます means drink, so it must be a drink: おちゃ (tea)."}},
{id:"m1g1",s:"bunpo",p:"わたしは バングラデシュじんです。ラヒムさん（　）バングラデシュじんです。",c:["も","の","を","が"],e:{bn:"「ও」বোঝাতে も: ラヒムさんも = রাহিমও। (পাঠ 1)",ja:"同じことを言うときは「も」を使います。（第1課）",en:"も means 'also': Rahim is Bangladeshi too."}},
{id:"m1g2",s:"bunpo",p:"これは だれ（　）かさですか。",c:["の","が","を","に"],e:{bn:"কার? = だれの। だれの かさ = কার ছাতা। (পাঠ 2)",ja:"持ち主を聞くときは「だれの N」です。（第2課）",en:"だれの N = whose N."}},
{id:"m1g3",s:"bunpo",p:"わたしは まいにち 6じ（　）おきます。",c:["に","で","を","へ"],e:{bn:"নির্দিষ্ট সময়ের পরে に বসে: 6じに おきます = 6টায় উঠি। (পাঠ 4)",ja:"時間のあとには「に」をつけます。（第4課）",en:"Clock times take に: 6じに = at six."}},
{id:"m1g4",s:"bunpo",p:"ゆいさんは ラヒムさん（　）ハンカチを もらいました。",c:["に","を","で","へ"],e:{bn:"কারো কাছ থেকে পাওয়া: (মানুষ) に もらいます। (পাঠ 7)",ja:"「（人）に もらいます」です。（第7課）",en:"(person) に もらいます = receive from someone."}},
{id:"m1g5",s:"bunpo",p:"「いっしょに えいがを みませんか。」「ええ、（　）。」",c:["みましょう","みません","みました","みませんでした"],e:{bn:"〜ませんか দাওয়াতের উত্তরে রাজি হলে 〜ましょう। (পাঠ 6)",ja:"誘われて「はい」のときは「〜ましょう」と答えます。（第6課）",en:"Accept a 〜ませんか invitation with 〜ましょう."}},
{id:"m1r1",s:"dokkai",g:"m1r",p:"ラヒムさんは どようびに なにを しますか。",c:["コンビニで はたらきます","がっこうで べんきょうします","しんじゅくへ いきます","うちで やすみます"],e:{bn:"「どようびは … コンビニで はたらきます」— শনিবার কনভিনিয়েন্স স্টোরে কাজ।",ja:"土曜日はコンビニで働きます。",en:"On Saturdays he works at the convenience store."}},
{id:"m1r2",s:"dokkai",g:"m1r",p:"がっこうは なんじに おわりますか。",c:["1じ","9じ","5じ","10じ"],e:{bn:"「9じから 1じまで」— স্কুল 1টায় শেষ।",ja:"9時から1時までです。",en:"School is from 9 to 1, so it ends at 1."}},
{id:"m1r3",s:"dokkai",g:"m1r",p:"ラヒムさんは なんで しんじゅくへ いきますか。",c:["でんしゃで","バスで","じてんしゃで","あるいて"],e:{bn:"「でんしゃで いきます」— ট্রেনে যায়।",ja:"電車で行きます。",en:"He goes by train."}},
{id:"m1l1",s:"chokai",p:"みせは なんじから なんじまでですか。",sc:[["N","おとこの ひとと おんなの ひとが はなして います。みせは なんじから なんじまでですか。"],["M","すみません、この みせは なんじからですか。"],["F","あさ 10じからです。"],["M","なんじまでですか。"],["F","よる 9じまでです。"]],c:["10じから 9じまで","9じから 10じまで","10じから 7じまで","7じから 9じまで"],e:{bn:"সকাল 10টা থেকে রাত 9টা পর্যন্ত। (পাঠ 4)",ja:"朝10時から夜9時までです。（第4課）",en:"From 10 a.m. to 9 p.m."}},
{id:"m1l2",s:"chokai",p:"おとこの ひとは だれと としょかんへ いきますか。",sc:[["N","おんなの ひとと おとこの ひとが はなして います。おとこの ひとは だれと としょかんへ いきますか。"],["F","あした どこへ いきますか。"],["M","としょかんへ いきます。"],["F","ひとりで いきますか。"],["M","いいえ、ともだちと いきます。"]],c:["ともだちと","ひとりで","かぞくと","せんせいと"],e:{bn:"「ひとりで?」— 「いいえ、ともだちと」। বন্ধুর সাথে যাবে। (পাঠ 5)",ja:"「ともだちと いきます」と言っています。（第5課）",en:"He says he is going with a friend."}},
{id:"m1l3",s:"chokai",p:"なんと いいますか。",sc:[["N","あさ、がっこうで せんせいに あいました。なんと いいますか。"]],c:["おはようございます","こんばんは","おやすみなさい","いただきます"],e:{bn:"সকালের অভিবাদন おはようございます। こんばんは = সন্ধ্যায়। (かな পাঠ)",ja:"朝のあいさつは「おはようございます」です。",en:"The morning greeting is おはようございます."}}
],
m2:[
{id:"m2m1",s:"moji",p:"この かばんは <u>高い</u>です。",c:["たかい","たがい","だかい","ながい"],e:{bn:"高い = たかい (দামি / উঁচু)। (পাঠ 8)",ja:"「高い」は「たかい」です。（第8課）",en:"高い = たかい (expensive / tall)."}},
{id:"m2m2",s:"moji",p:"<u>左</u>に ぎんこうが あります。",c:["ひだり","みぎ","ひがし","ひたり"],e:{bn:"左 = ひだり (বাম)। 右 = みぎ (ডান)। (পাঠ 10)",ja:"「左」は「ひだり」、「右」は「みぎ」です。（第10課）",en:"左 = ひだり (left); 右 = みぎ (right)."}},
{id:"m2m3",s:"moji",p:"この シャツは <u>千円</u>です。",c:["せんえん","ぜんえん","せんねん","ちえん"],e:{bn:"千 = せん, 円 = えん: 千円 = せんえん (1,000 ইয়েন)। (পাঠ 11)",ja:"「千円」は「せんえん」です。（第11課）",en:"千円 = せんえん (1,000 yen)."}},
{id:"m2m4",s:"moji",p:"きょうは <u>あめ</u>です。",c:["雨","雲","雪","電"],e:{bn:"あめ = 雨 (বৃষ্টি)। 雪 = ゆき (তুষার)। (পাঠ 12)",ja:"「あめ」は「雨」です。「雪」は「ゆき」です。（第12課）",en:"あめ = 雨 (rain). 雪 is ゆき (snow)."}},
{id:"m2m5",s:"moji",p:"へやが（　）ですから、まどを あけます。",c:["あつい","さむい","しずか","ひろい"],e:{bn:"জানালা খোলার কারণ: ঘর গরম (あつい)। (পাঠ 8)",ja:"窓を開けるのは部屋が「あつい」からです。（第8課）",en:"You open the window because the room is hot."}},
{id:"m2g1",s:"bunpo",p:"わたしは やさい（　）きらいです。",c:["が","を","へ","で"],e:{bn:"すき・きらい・じょうず-র আগে が বসে। (পাঠ 9)",ja:"「すき・きらい」の前は「が」です。（第9課）",en:"すき / きらい take が."}},
{id:"m2g2",s:"bunpo",p:"つくえの うえに ほん（　）あります。",c:["が","を","で","へ"],e:{bn:"(জায়গা) に N が あります = কোথাও কিছু আছে। (পাঠ 10)",ja:"「（場所）に N が あります」です。（第10課）",en:"(place) に N が あります = there is N at (place)."}},
{id:"m2g3",s:"bunpo",p:"りんごを（　）ください。",c:["みっつ","みっつの","みっつに","みっつで"],e:{bn:"সংখ্যা ক্রিয়ার ঠিক আগে বসে, কোনো কণা লাগে না: りんごを みっつ ください। (পাঠ 11)",ja:"数は「を」のあと、動詞の前に置きます。（第11課）",en:"The number goes straight before the verb, no particle."}},
{id:"m2g4",s:"bunpo",p:"ダッカと とうきょうと（　）が あついですか。",c:["どちら","どれ","なに","だれ"],e:{bn:"দুটোর মধ্যে তুলনা: A と B と どちらが 〜ですか। (পাঠ 12)",ja:"二つを比べるときは「どちら」です。（第12課）",en:"Comparing two things uses どちら."}},
{id:"m2g5",s:"bunpo",p:"すみません、ちょっと まって（　）。",c:["ください","いきます","あげます","ほしいです"],e:{bn:"অনুরোধ: て-রূপ + ください। まって ください = একটু অপেক্ষা করুন। (পাঠ 14)",ja:"お願いは「て形 + ください」です。（第14課）",en:"Request: te-form + ください."}},
{id:"m2r1",s:"dokkai",g:"m2r",p:"ラヒムさんの へやは どうですか。",c:["えきから ちかいですが、せまいです","えきから とおいですが、ひろいです","ひろくて、しずかです","ふるいですが、べんりです"],e:{bn:"「えきから ちかいです。でも、すこし せまいです」।",ja:"駅から近いですが、少しせまいです。",en:"It is near the station but a little small."}},
{id:"m2r2",s:"dokkai",g:"m2r",p:"へやに ない ものは どれですか。",c:["テレビ","ベッド","つくえ","いす"],e:{bn:"「テレビは ありません」— টিভি নেই।",ja:"「テレビは ありません」と書いてあります。",en:"There is no TV."}},
{id:"m2r3",s:"dokkai",g:"m2r",p:"ラヒムさんは ゆいさんと なにを したいですか。",c:["テレビを かいに いきたい","へやを そうじしたい","えきで あいたい","ベッドを かいたい"],e:{bn:"「テレビを かいに いきたいです。いっしょに いきませんか」।",ja:"一緒にテレビを買いに行きたいです。",en:"He wants to go buy a TV together."}},
{id:"m2l1",s:"chokai",p:"おとこの ひとは なにを のみますか。",sc:[["N","きっさてんで おんなの ひとと おとこの ひとが はなして います。おとこの ひとは なにを のみますか。"],["F","わたしは コーヒーを のみます。たなかさんは？"],["M","わたしは コーヒーが あまり すきじゃ ありません。こうちゃを ください。"]],c:["こうちゃ","コーヒー","ジュース","みず"],e:{bn:"কফি তেমন পছন্দ নয়, তাই こうちゃ (চা)। (পাঠ 9)",ja:"コーヒーが好きじゃないので、紅茶です。（第9課）",en:"He doesn't like coffee much, so he orders tea."}},
{id:"m2l2",s:"chokai",p:"ねこは どこに いますか。",sc:[["N","おとこの ひとと おんなの ひとが はなして います。ねこは どこに いますか。"],["M","あれ、ねこが いませんね。つくえの したですか。"],["F","いいえ。ベッドの うえに いますよ。"]],c:["ベッドの うえ","つくえの した","つくえの うえ","ベッドの した"],e:{bn:"「ベッドの うえに いますよ」— বিছানার উপরে। (পাঠ 10)",ja:"ベッドの上にいます。（第10課）",en:"The cat is on the bed."}},
{id:"m2l3",s:"chokai",p:"へんじは どれですか。",sc:[["N","へんじを えらんで ください。"],["F","にもつ、もちましょうか。"]],c:["あ、すみません。おねがいします","はい、もちましょう","いいえ、もちません","はい、もって います"],e:{bn:"〜ましょうか = সাহায্যের প্রস্তাব। উত্তর: すみません、おねがいします। (পাঠ 14)",ja:"「〜ましょうか」には「おねがいします」と答えます。（第14課）",en:"Answer an offer (〜ましょうか) with おねがいします."}}
],
m3:[
{id:"m3m1",s:"moji",p:"<u>駅</u>の まえで まって います。",c:["えき","えい","いき","えっき"],e:{bn:"駅 = えき (স্টেশন)। (পাঠ 15)",ja:"「駅」は「えき」です。（第15課）",en:"駅 = えき (station)."}},
{id:"m3m2",s:"moji",p:"<u>毎週</u> にちようびに サッカーを します。",c:["まいしゅう","まいしゅ","まいにち","めいしゅう"],e:{bn:"毎週 = まいしゅう (প্রতি সপ্তাহ)। 毎日 = まいにち। (পাঠ 16)",ja:"「毎週」は「まいしゅう」です。（第16課）",en:"毎週 = まいしゅう (every week)."}},
{id:"m3m3",s:"moji",p:"<u>電車</u>で きました。",c:["でんしゃ","てんしゃ","でんしや","でんじゃ"],e:{bn:"電車 = でんしゃ (ট্রেন)। ছোট ゃ খেয়াল করো। (পাঠ 17)",ja:"「電車」は「でんしゃ」です。（第17課）",en:"電車 = でんしゃ (train), with a small ゃ."}},
{id:"m3m4",s:"moji",p:"たべる まえに <u>て</u>を あらって ください。",c:["手","毛","午","牛"],e:{bn:"て = 手 (হাত)। 毛, 午, 牛 দেখতে কাছাকাছি। (পাঠ 18)",ja:"「て」は「手」です。（第18課）",en:"て = 手 (hand)."}},
{id:"m3m5",s:"moji",p:"そとは あついですから、ぼうしを（　）ください。",c:["かぶって","きて","はいて","かけて"],e:{bn:"টুপি পরা = かぶります। জামা = きます, জুতা = はきます, চশমা = かけます। (পাঠ 20)",ja:"ぼうしは「かぶります」。（第20課）",en:"Hats: かぶります. Shirts きます, shoes はきます, glasses かけます."}},
{id:"m3g1",s:"bunpo",p:"ここで しゃしんを とって（　）いいですか。",c:["も","は","が","を"],e:{bn:"অনুমতি চাওয়া: て-রূপ + も いいですか। (পাঠ 15)",ja:"許可は「〜ても いいですか」です。（第15課）",en:"Asking permission: 〜ても いいですか."}},
{id:"m3g2",s:"bunpo",p:"あさごはんを たべて（　）、がっこうへ いきます。",c:["から","まで","より","ので"],e:{bn:"একটা কাজ শেষ করে পরেরটা: て-রূপ + から। (পাঠ 16)",ja:"「〜てから」は順番を表します。（第16課）",en:"〜てから = after doing ~."}},
{id:"m3g3",s:"bunpo",p:"あしたは しけんですから、べんきょうし（　）。",c:["なければ なりません","なくても いいです","ないで ください","ては いけません"],e:{bn:"করতেই হবে: ない-রূপ থেকে 〜なければ なりません। (পাঠ 17)",ja:"しなければならないことは「〜なければ なりません」。（第17課）",en:"Must do: 〜なければ なりません."}},
{id:"m3g4",s:"bunpo",p:"ねる（　）、はを みがきます。",c:["まえに","あとで","ながら","から"],e:{bn:"অভিধান রূপ + まえに = … করার আগে। あとで-এর আগে た-রূপ লাগে। (পাঠ 18)",ja:"「辞書形 + まえに」です。「あとで」は「た形」につきます。（第18課）",en:"Dictionary form + まえに = before ~. あとで needs the ta-form."}},
{id:"m3g5",s:"bunpo",p:"わたしは ふじさんに のぼった（　）が あります。",c:["こと","とき","まえ","もの"],e:{bn:"অভিজ্ঞতা: た-রূপ + ことが あります। (পাঠ 19)",ja:"経験は「た形 + ことが あります」。（第19課）",en:"Experience: ta-form + ことが あります."}},

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function order(q){let a=hash(q.id)||1;const idx=[0,1,2,3];for(let i=3;i>0;i--){a=(Math.imul(a,1103515245)+12345)>>>0;const j=a%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}

/* ---------- scoring ---------- */
function score(setId,answers){
  const qs=BANK[setId],lv=setById(setId).lv;const k={moji:[0,0],bunpo:[0,0],dokkai:[0,0],chokai:[0,0]};
  qs.forEach(q=>{k[q.s][1]++;if(answers[q.id]===0)k[q.s][0]++});
  const knC=k.moji[0]+k.bunpo[0]+k.dokkai[0], knT=k.moji[1]+k.bunpo[1]+k.dokkai[1];
  const kn=Math.round(knC/knT*120), li=Math.round(k.chokai[0]/k.chokai[1]*60), total=kn+li;
  return {k,kn,li,total,pass:total>=LV[lv].pass&&kn>=38&&li>=19};
}

function viewTeacher(){
  const t=L();
  if(!cap.canEdit)return `<section class="hero"><h1 style="font-size:32px">${t.tTitle}</h1><p>${t.tOnly}</p></section><button class="btn line" type="button" id="toHome">${t.home}</button>`;
  const groups={};
  teacherRows.forEach(r=>(r.attempts||[]).forEach(a=>{const sid=legacySet(a);const key=(a.n||"?")+"|"+sid;(groups[key]=groups[key]||{name:a.n||"?",set:sid,list:[]}).list.push(a)}));
  const ordIdx=id=>SETS.findIndex(s=>s.id===id);
  const rows=Object.values(groups).map(g=>{g.list.sort((x,y)=>x.t-y.t);const last=g.list[g.list.length-1];const best=Math.max(...g.list.map(a=>a.tot));
    const secAvg=[0,1,2,3].map(i=>g.list.reduce((s,a)=>s+a.k[i][0]/a.k[i][1],0)/g.list.length);
    return {g,last,best,secAvg}}).sort((a,b)=>a.g.name.localeCompare(b.g.name)||ordIdx(a.g.set)-ordIdx(b.g.set));
  return `<section class="hero"><h1 style="font-size:32px">${t.tTitle}</h1><p>${t.tLead}</p></section>
  ${!cap.db?`<p class="note">${t.offline}</p>`:""}
  <div class="tbl-wrap">${rows.length?`<table><thead><tr><th>${t.stu}</th><th>${t.test}</th><th>${t.att}</th><th>${t.latest}</th><th>${t.best}</th><th>${t.sec} <span class="jp">文字·文法·読解·聴解</span></th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.g.name)}</td><td>${esc(setTitle(r.g.set))}</td><td class="n">${r.g.list.length}</td><td class="n">${r.last.tot}</td><td class="n">${r.best}</td><td><span class="mini">${r.secAvg.map(v=>`<i title="${Math.round(v*100)}%"><span style="width:${v*100}%"></span></i>`).join("")}</span> <span class="note">${r.secAvg.map(v=>Math.round(v*100)).join(" · ")}%</span></td><td><span class="pill ${r.last.p?"ok":"ng"}">${r.last.p?"合格":"不合格"}</span></td></tr>`).join("")}</tbody></table>`:`<p style="padding:16px" class="muted">${t.noRes}</p>`}</div>
  <div class="field" style="max-width:none"><label for="codes">${t.paste}</label><textarea id="codes" placeholder="JM1-..."></textarea><div><button class="btn" type="button" id="addCodes">${t.add}</button></div></div>`;
}
function renderLayer(){
  const t=L(),c=S.confirm;
  if(!c){$("#layer").innerHTML="";return}
  const E=S.exam;const un=E?BANK[E.set].length-Object.keys(E.ans).length:0;
  $("#layer").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mbox"><p style="margin:0">${c==="submit"?t.confirm:t.exitQ}</p>${c==="submit"&&un?`<p class="note" style="margin:0">${t.unanswered}: ${un}</p>`:""}<div class="row"><button class="btn line" type="button" id="mNo">${t.no}</button><button class="btn" type="button" id="mYes">${c==="submit"?t.yes:t.exitYes}</button></div></div></div>`;
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

/* ---------- speech ---------- */
let jaVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){jaVoice=null}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(S.screen==="exam")render()}}
function speak(q){try{speechSynthesis.cancel();q.sc.forEach(([sp,txt])=>{const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=.9;u.pitch=sp==="F"?1.35:sp==="M"?.75:1;speechSynthesis.speak(u)})}catch(e){}}

/* ---------- actions ---------- */
function startExam(setId){
  const nm=($("#nm")?.value??S.name).trim();
  if(!nm){S.screen="home";render();toast(L().needName);$("#nm")?.focus();return}
  S.name=nm;store.set("jm.name",nm);
  S.exam={set:setId,idx:0,ans:{},flag:{},plays:{},endAt:Date.now()+setById(setId).min*60000};
  persist();S.screen="exam";render();startTick();window.scrollTo(0,0);
}
function persist(){store.set("jm.exam",S.exam)}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(S.screen!=="exam"||!S.exam)return;const left=Math.max(0,Math.round((S.exam.endAt-Date.now())/1000));const el=$("#timer");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<120)}if(left<=0)finish()},1000)}
async function finish(){
  clearInterval(tick);try{speechSynthesis.cancel()}catch(e){}
  const E=S.exam;const sc=score(E.set,E.ans);
  const att={n:S.name,s:E.set,l:setById(E.set).lv,t:Date.now(),tot:sc.total,kn:sc.kn,li:sc.li,p:sc.pass,k:SEC_ORDER.map(s=>sc.k[s])};
  S.last={set:E.set,ans:E.ans,name:S.name,code:enc(att),saved:null};
  const hist=store.get("jm.hist",[]);hist.push(att);store.set("jm.hist",hist.slice(-60));
  S.exam=null;store.del("jm.exam");S.confirm=null;S.filter="all";S.screen="result";render();window.scrollTo(0,0);
  S.last.saved=await saveOnline(att);
  const m=$("#saveMsg");if(m&&S.screen==="result")m.textContent=S.last.saved?L().saved:L().local;
}
async function saveOnline(att){
  await capsReady;
  if(!cap.db||!cap.uid)return false;
  try{const ref=cap.db.doc("results/"+cap.uid);const snap=await ref.get();const prev=snap.exists?(snap.data().attempts||[]):[];
    await ref.set({attempts:[...prev,att].slice(-60),updatedAt:att.t});return true}catch(e){return false}
}
async function addCodes(){
  if(!cap.db){toast(L().offline);return}
  const raw=$("#codes").value.split(/\s+/).filter(Boolean);let ok=0,bad=0;
  for(const c of raw){const o=dec(c);if(!o){bad++;continue}
    try{await cap.db.doc("results/imp-"+hash(c).toString(36)).set({attempts:[o],imported:true,updatedAt:Date.now()});ok++}catch(e){bad++}}
  if(ok)toast(ok+" "+L().addedN);if(bad)setTimeout(()=>toast(L().bad+" ("+bad+")"),ok?2300:0);
  if(ok)$("#codes").value="";
}
function watchTeacher(){
  if(unsubT||!cap.db||!cap.canEdit)return;
  unsubT=cap.db.collection("results").onSnapshot(s=>{teacherRows=s.docs.map(d=>d.data());if(S.screen==="teacher")render()},()=>{unsubT=null});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;store.set("jm.lang",S.lang);render();return}
  if(b.dataset.start){startExam(b.dataset.start);return}
  if(b.id==="goHome"||b.id==="toHome"){if(S.screen==="exam"){S.confirm="exit";renderLayer();return}S.screen="home";render();return}
  if(b.id==="goTeacher"){if(S.screen==="exam")return;S.screen="teacher";render();watchTeacher();return}
  if(b.id==="resume"){S.screen="exam";render();startTick();return}
  if(b.dataset.f){S.filter=b.dataset.f;render();return}
  if(b.id==="copyCode"){copyText(S.last.code,$("#code"));return}
  if(b.id==="addCodes"){addCodes();return}
  if(b.id==="mNo"){S.confirm=null;renderLayer();return}
  if(b.id==="mYes"){if(S.confirm==="submit")finish();else{clearInterval(tick);try{speechSynthesis.cancel()}catch(err){}S.exam=null;store.del("jm.exam");S.confirm=null;S.screen="home";render()}return}
  const E=S.exam;if(S.screen!=="exam"||!E)return;
  const qs=BANK[E.set],q=qs[E.idx];
  if(b.dataset.pick!=null){E.ans[q.id]=+b.dataset.pick;persist();render();return}
  if(b.dataset.jump!=null){E.idx=+b.dataset.jump;try{speechSynthesis.cancel()}catch(err){}render();return}
  if(b.id==="prev"&&E.idx>0){E.idx--;render();return}
  if(b.id==="next"&&E.idx<qs.length-1){E.idx++;render();return}
  if(b.id==="flag"){E.flag[q.id]=!E.flag[q.id];persist();render();return}
  if(b.id==="play"){const pl=E.plays[q.id]??2;if(pl>0){E.plays[q.id]=pl-1;persist();speak(q);render()}return}
  if(b.id==="submit"){S.confirm="submit";renderLayer();return}
  if(b.id==="exit"){S.confirm="exit";renderLayer();return}
});
document.addEventListener("input",e=>{if(e.target.id==="nm"){S.name=e.target.value;store.set("jm.name",S.name)}});
document.addEventListener("keydown",e=>{if(S.screen!=="exam"||S.confirm||e.target.matches("input,textarea"))return;const E=S.exam,qs=BANK[E.set];
  if(/^[1-4]$/.test(e.key)){const ord=order(qs[E.idx]);E.ans[qs[E.idx].id]=ord[+e.key-1];persist();render()}
  else if(e.key==="ArrowRight"&&E.idx<qs.length-1){E.idx++;render()}else if(e.key==="ArrowLeft"&&E.idx>0){E.idx--;render()}});

/* ---------- capabilities ---------- */
const capsReady=(async()=>{
  try{const [db,user]=await Promise.all([window.claude?.use?.("db")??null,window.claude?.use?.("user")??null]);
    cap.db=db;cap.user=user;
    if(user){cap.uid=await user.id();cap.canEdit=!!(await user.canEdit())}
  }catch(e){}
  watchTeacher();if(S.screen==="teacher")render();
})();

render();
</script>
